services:
  app:
    build: .
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - NODE_ENV=development
      - OLLAMA_ENABLED=true
      - AIBACKENDS_PYTHON_URL=http://aibackends-python:8000
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - ollama-net

  # HTTP API for https://github.com/donvito/aibackends (local Python library).
  # Installs the API layer by default; pass build args for model extras, e.g.:
  #   docker compose build --build-arg AIBACKENDS_EXTRAS=api,llamacpp,pii aibackends-python
  aibackends-python:
    build:
      context: ./aibackends-python
      args:
        AIBACKENDS_EXTRAS: api
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      - DEFAULT_ACCESS_TOKEN=${DEFAULT_ACCESS_TOKEN:-}
      - AIBACKENDS_ACCESS_TOKEN=${AIBACKENDS_ACCESS_TOKEN:-${DEFAULT_ACCESS_TOKEN:-}}
      - AIBACKENDS_RUNTIME=${AIBACKENDS_RUNTIME:-llamacpp}
      - AIBACKENDS_MODEL=${AIBACKENDS_MODEL:-gemma3-270m-it}
      - AIBACKENDS_MODEL_PATH=${AIBACKENDS_MODEL_PATH:-}
      - AIBACKENDS_SKIP_AUTH=${AIBACKENDS_SKIP_AUTH:-false}
    volumes:
      # Optional: mount a local GGUF so summarize/classify work without HF download
      - ./aibackends-python/models:/models:ro
    networks:
      - ollama-net

  ollama:
    image: ollama/ollama
    container_name: ollama
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - ollama-net
    entrypoint: /bin/sh
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 120s
      retries: 3
    command: -c "ollama serve & sleep 5 && ollama pull gemma3:270m && wait"

volumes:
  ollama-data:

networks:
  ollama-net:
    driver: bridge
